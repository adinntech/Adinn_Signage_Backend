<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="robots" content="noindex,nofollow">
    <meta name="referrer" content="no-referrer">
    <title>Copy code</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #eef2f8;
            font-family: Montserrat, 'Segoe UI', Arial, sans-serif;
            color: #14294d
        }

        .card {
            background: #fff;
            border: 1px solid #dfe7f3;
            border-radius: 12px;
            padding: 28px 26px;
            width: min(92vw, 380px);
            text-align: center;
            box-shadow: 0 6px 24px rgba(16, 36, 73, .08)
        }

        .title {
            font-size: 11px;
            letter-spacing: 1px;
            color: #6a7890;
            margin: 0 0 10px
        }

        .code {
            font-family: Consolas, 'Courier New', monospace;
            font-size: 32px;
            font-weight: 600;
            letter-spacing: 10px;
            padding: 12px 8px 12px 18px;
            background: #f4f8fd;
            border: 1px dashed #9fb3d9;
            border-radius: 10px;
            margin-bottom: 18px;
            user-select: all
        }

        button {
            border: 0;
            cursor: pointer;
            color: #fff;
            font: 600 14px Montserrat, 'Segoe UI', Arial, sans-serif;
            padding: 12px 26px;
            border-radius: 9px;
            background: linear-gradient(90deg, #7c3aed, #f26b3a)
        }

        button:disabled {
            opacity: .5;
            cursor: default
        }

        button:focus-visible {
            outline: 3px solid #2563eb;
            outline-offset: 2px
        }

        .msg {
            font-size: 12px;
            min-height: 18px;
            margin-top: 12px;
            color: #61718a
        }
    </style>
</head>

<body>
    <div class="card">
        <p class="title">VERIFICATION CODE</p>
        <div class="code" id="code">------</div>
        <button id="copy" type="button">Copy code <span>&#128203;</span></button>
        <div class="msg" id="msg" role="status"></div>
    </div>
    <script>
        (function () {
            var code = (location.hash || '').replace(/\D/g, '').slice(0, 6);
            var box = document.getElementById('code'), msg = document.getElementById('msg'), btn = document.getElementById('copy'), timer;
            if (code.length !== 6) { msg.style.color = '#dc2626'; msg.textContent = 'No code found. Open the link from the email again.'; btn.disabled = true; return; }
            box.textContent = code;
            history.replaceState(null, '', location.pathname); /* the code leaves the address bar */
            function label(copied) { btn.innerHTML = (copied ? 'Copied!' : 'Copy code') + ' <span>' + (copied ? '&#10003;' : '&#128203;') + '</span>'; }
            function done() { label(true); msg.style.color = '#059669'; msg.textContent = 'Paste it in the Signage app.'; clearTimeout(timer); timer = setTimeout(function () { label(false); }, 2000); }
            function fallback() {
                var r = document.createRange(); r.selectNodeContents(box); var s = getSelection(); s.removeAllRanges(); s.addRange(r);
                try { if (document.execCommand('copy')) return done(); } catch (e) { }
                msg.textContent = 'Code selected. Press Ctrl+C to copy.';
            }
            /* The mail button click is the user's action, so most browsers let the page copy at once on load: no second click.
               After a successful copy the tab closes itself (browsers allow that only for tabs a script opened; otherwise it simply stays). */
            function copied() { done(); msg.textContent = 'Copied. Paste it in the Signage app. You can close this tab.'; setTimeout(function () { try { window.close(); } catch (e) { } }, 100); }
            function copyNow(auto) {
                if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(code).then(auto ? copied : done, auto ? function () { } : fallback);
                else if (!auto) fallback();
            }
            btn.addEventListener('click', function () { copyNow(false); });
            copyNow(true);
        })();
    </script>
</body>

</html>
